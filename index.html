<!DOCTYPE html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="chrome=1, IE=edge">
        <meta name="description" content="">
        <meta name="viewport" content="user-scalable=no">


        <title>Kitty Jewel Quest</title>

        <style type="text/css">

            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                background-color: #9BD157;
                overflow: hidden;
                position: relative;
                touch-action: none;
                -ms-touch-action: none;

                -webkit-touch-callout: none !important;                /* prevent callout to copy image, etc when tap to hold */
                -webkit-text-size-adjust: none !important;             /* prevent webkit from resizing text to fit */
                -webkit-user-select: none !important;                  /* prevent copy paste, to allow, change 'none' to 'text' */
            }

            #wrongRotation {
                display: none;
                z-index: 20;
                position: fixed;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 1);
                touch-action: none;
            }
            #wrongRotation img {
                display: block;
                width: 30%;
                margin-left: auto;
                margin-right: auto;
                position: relative;
                top: 45%;
                -webkit-transform: translateY(-50%);
                -ms-transform: translateY(-50%);
                transform: translateY(-50%);
                touch-action: none;
            }

            @font-face {
                font-family: 'Coverface';
                font-style: normal;
                font-weight: 400;
                src: url('assets/fnt/Coverface.ttf') format('opentype');
            }
            @font-face {
                font-family: 'NotoSans';
                font-style: normal;
                font-weight: 400;
                src: url('assets/fnt/NotoSans-Bold.ttf') format('opentype');
            }
        </style>



<!--        <script async src="//api.adinplay.com/libs/aiptag/pub/ISK/inlogic.sk/tag.min.js"></script>-->

        <!-- Telegram Web App SDK：必须在其他脚本之前加载 -->
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script type="text/javascript">
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.expand();
                }
            } catch (e) { console.log('Telegram WebApp init failed:', e); }
        </script>
        <!-- Adsgram 广告 SDK -->
        <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
        <style>
            #tg-ad-layer {
                position: fixed;
                bottom: 16px;
                left: 16px;
                z-index: 99999;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                pointer-events: none;
            }
            #tg-reward-btn {
                pointer-events: auto;
                font-size: 15px;
                padding: 10px 18px;
                background: linear-gradient(135deg, #00b4d8, #0096c7);
                color: #fff;
                border: none;
                border-radius: 10px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.5);
                cursor: pointer;
                display: none;
            }
            #tg-reward-btn:disabled { opacity: 0.5; cursor: not-allowed; }
            #tg-score-toast {
                pointer-events: none;
                font-size: 22px;
                font-weight: bold;
                color: #FFD700;
                text-shadow: 0 0 8px #000;
                display: none;
                animation: floatUp 1.2s ease forwards;
            }
            @keyframes floatUp {
                0%   { opacity: 1; transform: translateY(0); }
                100% { opacity: 0; transform: translateY(-60px); }
            }
        </style>

        <script src="js/game.js"></script>


    </head>

    <body>
        <div id="game"></div>

        <div id="wrongRotation">
            <img src="assets/img/rotate_screen.png" alt=""/>
        </div>

        <div class="font_preload" style="opacity: 0">
            <span style="font-family: 'Coverface', Arial, sans-serif;"></span>
            <span style="font-family: 'NotoSans', Arial, sans-serif;"></span>
        </div>

        <div id="ads"></div>

        <!-- ================= Adsgram 广告区 ================= -->
        <div id="tg-ad-layer">
            <div id="tg-score-toast">+200</div>
            <button id="tg-reward-btn" onclick="tgShowRewardAd()">📺 Watch Ad +200</button>
        </div>

        <script type="text/javascript">
        (function () {
            var REWARD_AMOUNT = 200;
            var AdController = null;
            var IntAdController = null;

            // 奖励回调：游戏脚本可覆盖此函数以真正加分（window.onAdsgramReward = fn）
            if (typeof window.onAdsgramReward !== 'function') {
                window.onAdsgramReward = function () {};
            }

            // 从 ID.txt 读取广告位 ID，格式 KEY=VALUE，每行一个
            function loadConfig(cb) {
                fetch('ID.txt?_=' + Date.now())
                    .then(function (r) { return r.text(); })
                    .then(function (text) {
                        var cfg = {};
                        text.split('\n').forEach(function (line) {
                            var parts = line.trim().split('=');
                            if (parts.length === 2) cfg[parts[0].trim()] = parts[1].trim();
                        });
                        cb(cfg);
                    })
                    .catch(function () { cb({}); });
            }

            function initAds(cfg) {
                if (!window.Adsgram) return;
                var rewardId = cfg['REWARD_BLOCK_ID'] || '';
                var intId    = cfg['INT_BLOCK_ID']    || '';
                try { if (rewardId) AdController    = window.Adsgram.init({ blockId: rewardId }); } catch (e) {}
                try { if (intId)    IntAdController = window.Adsgram.init({ blockId: intId });    } catch (e) {}

                document.getElementById('tg-reward-btn').style.display = 'block';
                startIntAdTimer();
            }

            function waitAndInit(cfg) {
                if (window.Adsgram) {
                    initAds(cfg);
                } else {
                    var sdkCheck = setInterval(function () {
                        if (window.Adsgram) { clearInterval(sdkCheck); initAds(cfg); }
                    }, 300);
                }
            }

            loadConfig(function (cfg) { waitAndInit(cfg); });

            // 激励广告：看完 +200
            window.tgShowRewardAd = function () {
                if (!AdController) return;
                var btn = document.getElementById('tg-reward-btn');
                btn.disabled = true;
                AdController.show().then(function () {
                    if (typeof window.onAdsgramReward === 'function') {
                        window.onAdsgramReward(REWARD_AMOUNT);
                    }
                    var toast = document.getElementById('tg-score-toast');
                    toast.textContent = '+' + REWARD_AMOUNT;
                    toast.style.display = 'block';
                    toast.style.animation = 'none';
                    setTimeout(function () {
                        toast.style.animation = 'floatUp 1.2s ease forwards';
                        setTimeout(function () { toast.style.display = 'none'; }, 1200);
                    }, 20);
                    // 60 秒冷却
                    var cd = 60;
                    btn.textContent = '⏳ ' + cd + 's';
                    var cdTimer = setInterval(function () {
                        cd--;
                        if (cd <= 0) {
                            clearInterval(cdTimer);
                            btn.disabled = false;
                            btn.textContent = '📺 Watch Ad +' + REWARD_AMOUNT;
                        } else {
                            btn.textContent = '⏳ ' + cd + 's';
                        }
                    }, 1000);
                }).catch(function () {
                    btn.disabled = false;
                });
            };

            // 插屏广告：每 30 秒自动弹出
            var intAdInterval = null;
            function startIntAdTimer() {
                if (intAdInterval) clearInterval(intAdInterval);
                intAdInterval = setInterval(function () {
                    if (!IntAdController) return;
                    IntAdController.show().then(function () {}).catch(function () {});
                }, 30000);
            }
        })();
        </script>
    </body>
</html>
